version: '3.9'

services:
  website:
    container_name: dotnetmvcpropertymanager_website
    build:
      context: .
      dockerfile: Website/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    image: dotnetmvcpropertymanager_website:latest
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgresdb;Username=postgres;Port=5432;Password=postgres;Database=PropertyManager;Pooling=true;
    depends_on:
      postgresdb:
        condition: service_healthy
    networks:
      - api
      - db
    # restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./dpkeys:/home/app/.aspnet/DataProtection-Keys

  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=PropertyManager
    shm_size: 128mb
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "PropertyManager", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db

networks:
  api:
    driver: bridge
  db:
    driver: bridge

volumes:
  pgdata:
    driver: local